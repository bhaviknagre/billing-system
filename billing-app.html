<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hisaab — GST Billing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#2E3F9E;
  --bg:#F3F5FA; --surface:#FFFFFF; --sunk:#E9EDF5; --ink:#1A2033; --muted:#5B6479; --line:#D6DCE8;
  --paid:#177245; --paid-bg:#E3F3EA; --due:#A8261C; --due-bg:#FBE7E5; --part:#8A5A00; --part-bg:#FCF1D8;
  --paper:#FFFFFF; --paper-ink:#1A2033;
  --r:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10131C; --surface:#181C28; --sunk:#222838; --ink:#E6E9F2; --muted:#9AA3B8; --line:#2E3548;
    --paid:#5FD394; --paid-bg:#15301F; --due:#FF8A80; --due-bg:#3A1A18; --part:#F2C261; --part-bg:#3A2E12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10131C; --surface:#181C28; --sunk:#222838; --ink:#E6E9F2; --muted:#9AA3B8; --line:#2E3548;
  --paid:#5FD394; --paid-bg:#15301F; --due:#FF8A80; --due-bg:#3A1A18; --part:#F2C261; --part-bg:#3A2E12;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:700;padding:0 10px 4px;color:var(--brand)}
.biz{font-size:13px;color:var(--muted);padding:0 10px 18px;border-bottom:1px solid var(--line);margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--brand);color:#fff}
.nav .mode{margin-top:auto;font-size:12px;color:var(--muted);padding:10px}
main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
h1{font-family:Fraunces,Georgia,serif;font-size:28px;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 12px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.danger{color:var(--due)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.stat{background:var(--surface);padding:16px 18px}
.stat b{display:block;font-size:24px;font-weight:700;margin-top:2px}
.stat span{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.pill.paid{background:var(--paid-bg);color:var(--paid)}
.pill.unpaid{background:var(--due-bg);color:var(--due)}
.pill.partial{background:var(--part-bg);color:var(--part)}
.pill.low{background:var(--due-bg);color:var(--due)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty p{margin:0 0 14px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:64px}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:14px;margin:6px 0}
.chk input{width:auto}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
.grid>*{min-width:0}
.items td{padding:6px}
.items input,.items select{padding:6px 8px}
.items .x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px;padding:4px 8px}
.search{max-width:320px}
.btn.big{padding:11px 20px;font-size:15px}
.notice{display:block;background:var(--part-bg);color:var(--part);padding:10px 14px;border-radius:8px;font-weight:600;text-decoration:none;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:99px;cursor:pointer;font-weight:600;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;color:var(--ink);font-size:14px;margin:0}
.seg input{width:auto}
.seg label:has(input:checked){border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
details *{box-sizing:border-box}
details.more>summary{cursor:pointer;font-weight:600;color:var(--muted);list-style:none}
details.more>summary::before{content:"▸ "}
details.more[open]>summary::before{content:"▾ "}
details.more[open]>summary{margin-bottom:12px}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 6px 24px rgba(20,30,60,.12);z-index:5}
.savebar b{display:block;font-size:22px}
.narrow{max-width:760px}
/* Invoice paper */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:4px;box-shadow:0 1px 2px rgba(20,30,60,.08),0 8px 30px rgba(20,30,60,.10);padding:34px 36px;font-size:13px;line-height:1.45;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);overflow-x:auto}
.paper .top{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--brand);padding-bottom:16px;margin-bottom:16px}
.paper .bn{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:700;color:var(--brand);margin:0 0 4px}
.paper .tt{font-size:12px;letter-spacing:.06em;color:#5B6479;text-align:right}
.paper .ino{font-size:18px;font-weight:700;text-align:right}
.paper .meta{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.paper .lbl{font-size:11px;color:#5B6479;font-weight:600;margin-bottom:2px}
.paper table{font-size:12.5px;min-width:520px}
.paper th{color:#5B6479;background:#F3F5FA;border-bottom:1px solid #D6DCE8;padding:7px 8px;font-size:11.5px}
.paper td{border-bottom:1px solid #E6EAF2;padding:7px 8px}
.paper .tot{display:flex;justify-content:flex-end;margin-top:12px}
.paper .tot table{width:auto;min-width:260px}
.paper .tot td{border:0;padding:3px 8px}
.paper .grand td{font-size:16px;font-weight:800;border-top:2px solid #1A2033;padding-top:8px}
.paper .words{margin-top:10px;font-style:italic}
.paper .foot{display:flex;justify-content:space-between;gap:20px;margin-top:22px;padding-top:14px;border-top:1px solid #D6DCE8;font-size:12px}
.paper .sign{text-align:right;min-width:160px}
.paper .sign div{margin-top:36px;border-top:1px solid #1A2033;padding-top:4px}
/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(10,14,28,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.modal .box{background:var(--surface);border-radius:12px;padding:22px;width:min(560px,100%);max-height:88vh;overflow:auto}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
#toast.show{opacity:1}
#print-area{display:none}
@media (max-width:980px){.split{grid-template-columns:1fr}.paper{position:static}.pv{display:none}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .nav{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding:8px;z-index:10;border-right:0;border-bottom:1px solid var(--line)}
  .logo,.biz,.nav .mode{display:none}
  .nav a{white-space:nowrap;padding:7px 12px;font-size:14px}
  .paper{padding:20px 16px}
  .paper .meta{grid-template-columns:1fr}
  .hide-sm{display:none}
  .items{min-width:0!important}
  .items thead{display:none}
  .items tbody{display:block}
  .items tr{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
  .items td{display:block;padding:0!important;border:0!important;flex:1 1 0;min-width:0}
  .items td[data-label]::before{content:attr(data-label);display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px}
  .items td:first-child{flex-basis:100%}
  .items td:last-child{flex:0 0 auto;align-self:center}
  .items td:nth-last-child(2){text-align:left;font-weight:700;padding-bottom:8px!important}
  .items input,.items select{width:100%!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff}
  .app,.modal,#toast{display:none!important}
  #print-area{display:block}
  #print-area .paper{box-shadow:none;position:static;padding:0}
  @page{margin:14mm}
}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav"></nav>
  <main id="view"></main>
</div>
<div class="modal" id="modal" hidden><div class="box" id="mbox" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<div id="print-area"></div>

<script>
/* ============ Data & config ============ */
const STATES=[["01","Jammu & Kashmir"],["02","Himachal Pradesh"],["03","Punjab"],["04","Chandigarh"],["05","Uttarakhand"],["06","Haryana"],["07","Delhi"],["08","Rajasthan"],["09","Uttar Pradesh"],["10","Bihar"],["11","Sikkim"],["12","Arunachal Pradesh"],["13","Nagaland"],["14","Manipur"],["15","Mizoram"],["16","Tripura"],["17","Meghalaya"],["18","Assam"],["19","West Bengal"],["20","Jharkhand"],["21","Odisha"],["22","Chhattisgarh"],["23","Madhya Pradesh"],["24","Gujarat"],["26","Dadra & Nagar Haveli and Daman & Diu"],["27","Maharashtra"],["29","Karnataka"],["30","Goa"],["31","Lakshadweep"],["32","Kerala"],["33","Tamil Nadu"],["34","Puducherry"],["35","Andaman & Nicobar"],["36","Telangana"],["37","Andhra Pradesh"],["38","Ladakh"]];
const stateName=c=>(STATES.find(s=>s[0]===c)||[,""])[1];
const DEF={name:"Your Business Name",gstin:"",address:"",state:"27",phone:"",email:"",prefix:"INV-",rates:"0,5,18,40",currency:"₹",gstEnabled:true,stockEnabled:false,discEnabled:false,roundOff:true,bank:"",upi:"",terms:"Goods once sold will not be taken back. Thank you for your business.",brand:"#2E3F9E",dueDays:15,docTitle:"Tax Invoice"};
const S={settings:{...DEF},products:{},customers:{},invoices:{}};
let DB=null,DL=null,draft=null;
const LKEY="hisaab-billing-v1";

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r2=n=>Math.round((+n||0)*100)/100;
const money=n=>S.settings.currency+(+n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+(+n||0));return x.toISOString().slice(0,10)};
const fdate=d=>d?new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):"";
const rates=()=>String(S.settings.rates).split(",").map(x=>parseFloat(x)).filter(x=>!isNaN(x));

/* ============ Storage (cloud db when available, else this browser) ============ */
/* In the Android app (native.js sets window.HisaabNative) all data is one compact JSON file on the phone. */
const NATIVE=window.HisaabNative||null;
function applyData(d){S.products=d.products||{};S.customers=d.customers||{};S.invoices=d.invoices||{};S.settings={...DEF,...(d.settings||{})}}
const dataJSON=pretty=>JSON.stringify({v:1,settings:S.settings,customers:S.customers,invoices:S.invoices,...(Object.keys(S.products).length?{products:S.products}:{})},null,pretty?2:0);
function loadLocal(){try{const r=localStorage.getItem(LKEY);if(r)applyData(JSON.parse(r))}catch(e){}}
let saveQ=Promise.resolve();
function saveLocal(){
  if(DB)return;const json=dataJSON();
  if(NATIVE){saveQ=saveQ.then(()=>NATIVE.writeData(json)).catch(e=>toast("Couldn't save: "+(e.message||e)));return}
  try{localStorage.setItem(LKEY,json)}catch(e){}
}
async function put(coll,id,obj){S[coll][id]=obj;if(DB){try{await DB.collection(coll).doc(id).set(obj)}catch(e){toast("Couldn't save: "+(e.message||e.code))}}else saveLocal()}
async function remove(coll,id){delete S[coll][id];if(DB){try{await DB.collection(coll).doc(id).delete()}catch(e){toast("Couldn't delete: "+(e.message||e.code))}}else saveLocal()}
async function putSettings(o){S.settings=o;if(DB){try{await DB.doc("settings/business").set(o)}catch(e){toast("Couldn't save settings: "+(e.message||e.code))}}else saveLocal()}
async function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    claude.use("downloads").then(d=>{DL=d}).catch(()=>{});
    const db=await claude.use("db");if(!db)return;
    DB=db;
    ["products","customers","invoices"].forEach(c=>{
      db.collection(c).limit(1000).onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});S[c]=o;onData()},e=>toast("Sync stopped: "+e.message));
    });
    db.doc("settings/business").onSnapshot(s=>{S.settings={...DEF,...(s.exists?s.data():{})};onData()},()=>{});
    renderNav();
  }catch(e){}
}
function onData(){applyBrand();renderNav();const v=route().v;if(v!=="new"&&v!=="edit"&&$("#modal").hidden)render()}

/* ============ Calculations ============ */
function calc(inv){
  const intra=!S.settings.gstEnabled?true:(inv.custState||S.settings.state)===S.settings.state;
  let sub=0,disc=0,cg=0,sg=0,ig=0;const taxBy={};
  const lines=(inv.items||[]).map(it=>{
    const gross=(+it.qty||0)*(+it.price||0);const d=gross*(+it.disc||0)/100;const base=gross-d;
    const rate=S.settings.gstEnabled?(+it.gst||0):0;const tax=base*rate/100;
    sub+=gross;disc+=d;
    if(intra){cg+=tax/2;sg+=tax/2}else ig+=tax;
    taxBy[rate]=taxBy[rate]||{base:0,tax:0};taxBy[rate].base+=base;taxBy[rate].tax+=tax;
    return{...it,base:r2(base),tax:r2(tax),amount:r2(base+tax)};
  });
  const raw=sub-disc+cg+sg+ig;const total=S.settings.roundOff?Math.round(raw):r2(raw);
  return{lines,intra,sub:r2(sub),disc:r2(disc),taxable:r2(sub-disc),cgst:r2(cg),sgst:r2(sg),igst:r2(ig),round:r2(total-raw),total,taxBy};
}
const paidOf=inv=>r2((inv.payments||[]).reduce((a,p)=>a+(+p.amount||0),0));
function status(inv){const p=paidOf(inv);if(p>=inv.total-0.005)return"paid";if(p>0)return"partial";return"unpaid"}
const pill=s=>`<span class="pill ${s}">${{paid:"Paid",partial:"Part paid",unpaid:"Unpaid"}[s]}</span>`;
function nextNo(){const pre=S.settings.prefix;let max=0;Object.values(S.invoices).forEach(i=>{if(String(i.no).startsWith(pre)){const n=parseInt(String(i.no).slice(pre.length));if(n>max)max=n}});return pre+String(max+1).padStart(4,"0")}

function inWords(num){
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=n=>n<20?a[n]:b[Math.floor(n/10)]+(n%10?" "+a[n%10]:"");
  const three=n=>(n>=100?a[Math.floor(n/100)]+" Hundred"+(n%100?" ":""):"")+(n%100?two(n%100):"");
  const r=Math.floor(num),p=Math.round((num-r)*100);
  if(r===0&&p===0)return"Zero Rupees Only";
  const parts=[];const cr=Math.floor(r/1e7),lk=Math.floor(r/1e5)%100,th=Math.floor(r/1e3)%100,rest=r%1000;
  if(cr)parts.push(three(cr)+" Crore");if(lk)parts.push(two(lk)+" Lakh");if(th)parts.push(two(th)+" Thousand");if(rest)parts.push(three(rest));
  return(parts.length?parts.join(" ")+" Rupees":"")+(p?(parts.length?" and ":"")+two(p)+" Paise":"")+" Only";
}

/* ============ Invoice document ============ */
function invoiceHTML(inv){
  const st=S.settings,c=calc(inv),g=st.gstEnabled;const cu=inv.cust||{};const hd=c.lines.some(l=>+l.disc);
  const rows=c.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.name)}${l.hsn?`<div style="color:#5B6479;font-size:11px">HSN/SAC ${esc(l.hsn)}</div>`:""}</td><td class="num">${esc(l.qty)} ${esc(l.unit||"")}</td><td class="num">${money(l.price)}</td>${hd?`<td class="num">${+l.disc?esc(l.disc)+"%":"—"}</td>`:""}<td class="num">${money(l.base)}</td>${g?`<td class="num">${esc(l.gst)}%</td>`:""}<td class="num">${money(l.amount)}</td></tr>`).join("")||`<tr><td colspan="8" style="text-align:center;color:#5B6479;padding:20px">Add items to see them here</td></tr>`;
  const bal=r2(inv.total!=null?inv.total-paidOf(inv):c.total);
  return`<div class="paper" style="--brand:${esc(st.brand)}">
  <div class="top"><div><p class="bn">${esc(st.name)}</p><div>${esc(st.address).replace(/\n/g,"<br>")}</div>
  <div>${st.phone?"Ph: "+esc(st.phone):""}${st.email?" &nbsp; "+esc(st.email):""}</div>
  ${g&&st.gstin?`<div><b>GSTIN:</b> ${esc(st.gstin)}</div>`:""}<div><b>State:</b> ${esc(stateName(st.state))} (${esc(st.state)})</div></div>
  <div><div class="tt">${esc(st.docTitle)}</div><div class="ino">${esc(inv.no||"")}</div><div style="text-align:right">Date: ${fdate(inv.date)}<br>${inv.due?"Due: "+fdate(inv.due):""}</div></div></div>
  <div class="meta"><div><div class="lbl">Bill to</div><b>${esc(cu.name||"Walk-in customer")}</b><div>${esc(cu.address||"").replace(/\n/g,"<br>")}</div>${cu.phone?`<div>Ph: ${esc(cu.phone)}</div>`:""}${g&&cu.gstin?`<div><b>GSTIN:</b> ${esc(cu.gstin)}</div>`:""}</div>

async function saveInvoice(){
  const inv=draftInvoice(),isNew=!draft.id,id=draft.id||uid("i");
  if(!inv.items.length)return toast("Add at least one item — type its name and quantity.");
  let customerId="";
  if(inv.cust){
    const ex=findCust(inv.cust.name);customerId=ex?ex.id:uid("c");
    const cd={...(ex||{email:""}),id:customerId,...inv.cust};
    if(!ex||["phone","gstin","address","state"].some(k=>(ex[k]||"")!==(cd[k]||"")))await put("customers",customerId,cd);
  }
  const c=calc(inv);
  const out={id,no:draft.no,date:draft.date,due:draft.due,customerId,cust:inv.cust,custState:inv.custState,items:inv.items,notes:draft.notes,total:c.total,taxable:c.taxable,cgst:c.cgst,sgst:c.sgst,igst:c.igst,payments:draft.payments||[],createdAt:draft.createdAt||Date.now()};
  if(isNew&&draft.payNow==="paid"&&c.total>0)out.payments=[{date:draft.date,amount:c.total,mode:draft.payMode}];
  await put("invoices",id,out);draft=null;toast(isNew?"Bill generated":"Bill updated");go("inv/"+id);
}

/* ---- Customers ---- */
let cq="";
/* Saved customers plus any name that appears on a bill, each with its bills. */
function allCustomers(){
  const rows=list(S.customers).map(c=>({...c,bills:[]})),byId={},byName={};
  rows.forEach(r=>{byId[r.id]=r;byName[r.name.trim().toLowerCase()]=r});
  list(S.invoices).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach(i=>{
    const n=(i.cust?.name||"").trim();if(!n)return;
    let r=byId[i.customerId]||byName[n.toLowerCase()];
    if(!r){r={id:"",name:n,phone:i.cust.phone||"",gstin:i.cust.gstin||"",address:i.cust.address||"",state:i.cust.state||i.custState,bills:[]};rows.push(r);byName[n.toLowerCase()]=r}
    r.bills.push(i);
  });
  return rows.sort((a,b)=>a.name.localeCompare(b.name));
}

  <div class="row" style="align-self:flex-end"><button class="btn sm" data-a="range" data-r="month">This month</button><button class="btn sm" data-a="range" data-r="last">Last month</button><button class="btn sm" data-a="range" data-r="fy">This financial year</button></div></div>
  <div class="stats"><div class="stat"><span>Invoices</span><b>${inv.length}</b></div><div class="stat"><span>Taxable value</span><b>${money(sum("taxable"))}</b></div>${g?`<div class="stat"><span>GST collected</span><b>${money(sum("cgst")+sum("sgst")+sum("igst"))}</b></div>`:""}<div class="stat"><span>Total sales</span><b>${money(sum("total"))}</b></div><div class="stat"><span>Payments received</span><b>${money(coll)}</b></div></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
  ${g?`<div><h2>GST summary</h2><div class="tw"><table><thead><tr><th>Rate</th><th class="num">Taxable</th><th class="num">CGST</th><th class="num">SGST</th><th class="num">IGST</th></tr></thead><tbody>
   ${(()=>{const rows={};inv.forEach(i=>{const c=calc(i);c.lines.forEach(l=>{const r=+l.gst||0;rows[r]=rows[r]||{b:0,c:0,s:0,i:0};rows[r].b+=l.base;if(c.intra){rows[r].c+=l.tax/2;rows[r].s+=l.tax/2}else rows[r].i+=l.tax})});const ks=Object.keys(rows).sort((a,b)=>a-b);return ks.length?ks.map(r=>`<tr><td>${r}%</td><td class="num">${money(rows[r].b)}</td><td class="num">${money(rows[r].c)}</td><td class="num">${money(rows[r].s)}</td><td class="num">${money(rows[r].i)}</td></tr>`).join("")+`<tr><td><b>Total</b></td><td class="num"><b>${money(sum("taxable"))}</b></td><td class="num"><b>${money(sum("cgst"))}</b></td><td class="num"><b>${money(sum("sgst"))}</b></td><td class="num"><b>${money(sum("igst"))}</b></td></tr>`:`<tr><td colspan="5" class="muted">No sales in this period.</td></tr>`})()}
  </tbody></table></div></div>`:""}
  <div><h2>Top items</h2><div class="tw"><table><thead><tr><th>Item</th><th class="num">Qty sold</th><th class="num">Sales</th></tr></thead><tbody>${top.length?top.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="num">${r2(v.qty)}</td><td class="num">${money(v.amt)}</td></tr>`).join(""):`<tr><td colspan="3" class="muted">No sales in this period.</td></tr>`}</tbody></table></div></div>
  <div><h2>Who owes you (all time)</h2><div class="tw"><table><thead><tr><th>Customer</th><th class="num">Balance due</th></tr></thead><tbody>${oweArr.length?oweArr.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="num" style="color:var(--due)">${money(v)}</td></tr>`).join(""):`<tr><td colspan="2" class="muted">Nothing outstanding.</td></tr>`}</tbody></table></div></div>
  </div>`;
}
function bindReports(){["#rf","#rt"].forEach(s=>$(s).addEventListener("change",()=>{rep={from:$("#rf").value,to:$("#rt").value};render()}))}

/* ---- Settings (per-client customisation) ---- */
function vSettings(){
  const s=S.settings;
  return`<div class="head"><h1>Settings</h1></div>
  <div class="grid narrow">
  <div class="panel"><h2>Your shop</h2><p class="small muted" style="margin-top:-6px">This is printed at the top of every bill.</p>
   <div class="fr"><div style="grid-column:1/-1"><label>Shop / business name</label><input id="s_name" value="${esc(s.name)}"></div></div>
   <div class="fr"><div><label>Phone</label><input id="s_phone" value="${esc(s.phone)}"></div><div><label>Email</label><input id="s_email" value="${esc(s.email)}"></div></div>
   <label>Address</label><textarea id="s_address">${esc(s.address)}</textarea>
   <div class="fr" style="margin-top:12px"><div><label>State</label><select id="s_state">${STATES.map(x=>`<option value="${x[0]}" ${s.state===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select></div><div><label>GSTIN (leave blank if not registered)</label><input id="s_gstin" value="${esc(s.gstin)}" maxlength="15" style="text-transform:uppercase"></div></div>
  </div>
  <div class="panel"><h2>How customers pay you</h2>
   <div class="fr"><div style="grid-column:1/-1"><label>UPI ID</label><input id="s_upi" value="${esc(s.upi)}" placeholder="yourname@upi"></div></div>
   <label>Bank details</label><textarea id="s_bank" placeholder="Bank name, account no., IFSC">${esc(s.bank)}</textarea>
  </div>
  <div class="panel"><h2>Turn features on or off</h2>
   <label class="chk"><input type="checkbox" id="s_gstEnabled" ${s.gstEnabled?"checked":""}> Add GST to bills</label>
   <label class="chk"><input type="checkbox" id="s_discEnabled" ${s.discEnabled?"checked":""}> Give discounts on items</label>
  </div>
  <details class="panel more"><summary>More settings — bill number, colour, terms, GST rates</summary>
   <div class="fr"><div><label>Bill number starts with</label><input id="s_prefix" value="${esc(s.prefix)}"></div><div><label>Payment due after (days)</label><input type="number" min="0" id="s_dueDays" value="${esc(s.dueDays)}"></div></div>
   <div class="fr"><div><label>Title on bill</label><input id="s_docTitle" value="${esc(s.docTitle)}"></div><div><label>Colour</label><input type="color" id="s_brand" value="${esc(s.brand)}" style="height:40px;padding:4px"></div></div>
   <div class="fr"><div style="grid-column:1/-1"><label>GST rates to choose from (%)</label><input id="s_rates" value="${esc(s.rates)}" placeholder="0,5,18,40"></div></div>
   <label>Terms printed on bill</label><textarea id="s_terms">${esc(s.terms)}</textarea>
   <label class="chk" style="margin-top:10px"><input type="checkbox" id="s_roundOff" ${s.roundOff?"checked":""}> Round totals to the nearest rupee</label>
  </details>
  <details class="panel more"><summary>Backup & data</summary>
   <p class="small muted" style="margin-top:0">${DB?"Your data is saved to your account.":NATIVE?"Your data is saved on this phone in one small file. Uninstalling the app deletes it, so save a backup now and then (e.g. to Google Drive or WhatsApp).":"Your data is saved in this browser only — download a backup now and then."}</p>
   <div class="row"><button class="btn" data-a="backup">${NATIVE?"Save / share backup":"Download backup"}</button><button class="btn" data-a="restore">Restore from backup</button><input type="file" id="restoreFile" accept=".json,application/json" hidden>${sampleButton()}<button class="btn danger" data-a="wipe">Erase all data</button></div>
  </details>
  <div class="panel savebar"><span></span><button class="btn pri big" data-a="savesettings">Save settings</button></div>
  </div>`;
}
async function saveSettings(){
  const o={...S.settings};
  ["name","address","phone","email","gstin","state","docTitle","prefix","brand","rates","bank","upi","terms"].forEach(k=>{o[k]=$("#s_"+k).value.trim()});
  o.gstin=o.gstin.toUpperCase();o.dueDays=+$("#s_dueDays").value||0;
  ["gstEnabled","discEnabled","roundOff"].forEach(k=>{o[k]=$("#s_"+k).checked});
  if(o.gstin&&!/^[0-9]{2}[A-Z0-9]{13}$/.test(o.gstin))return toast("GSTIN should be 15 characters, like 27ABCDE1234F1Z5.");
  if(o.gstin&&o.gstin.slice(0,2)!==o.state)toast("Note: GSTIN state code doesn't match the selected state.");
  if(!o.rates||!String(o.rates).split(",").some(x=>!isNaN(parseFloat(x))))o.rates=DEF.rates;
  await putSettings(o);applyBrand();render();toast("Settings saved");
}

/* ============ Modals ============ */
function modal(html){$("#mbox").innerHTML=html;$("#modal").hidden=false;const f=$("#mbox input,#mbox select");f&&f.focus()}
function ask(msg,ok){return new Promise(res=>{modal(`<p style="margin:0 0 4px;font-weight:600;font-size:16px">${esc(msg)}</p><div class="acts"><button class="btn" id="ask_no">Cancel</button><button class="btn pri" id="ask_yes">${esc(ok||"Confirm")}</button></div>`);$("#ask_no").onclick=()=>{$("#modal").hidden=true;res(false)};$("#ask_yes").onclick=()=>{$("#modal").hidden=true;res(true)};$("#ask_yes").focus()})}
function closeModal(){$("#modal").hidden=true;$("#mbox").innerHTML="";if(route().v!=="new"&&route().v!=="edit")render()}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("#modal").hidden)return closeModal();
});
function custModal(id,pre){
  const c=id?S.customers[id]:(pre||{name:"",phone:"",gstin:"",state:S.settings.state,address:""});const g=S.settings.gstEnabled;
  modal(`<h2>${id?"Edit customer":"Add customer"}</h2>
  <div class="fr"><div><label>Name</label><input id="c_name" value="${esc(c.name)}"></div><div><label>Phone</label><input id="c_phone" value="${esc(c.phone)}" inputmode="tel"></div></div>
  <details class="more" ${c.gstin||c.address||c.state!==S.settings.state?"open":""}><summary>More — ${g?"GSTIN, ":""}address, state</summary>
  <div class="fr">${g?`<div><label>GSTIN (only for businesses)</label><input id="c_gstin" value="${esc(c.gstin)}" maxlength="15" style="text-transform:uppercase"></div>`:""}<div><label>State</label><select id="c_state">${STATES.map(x=>`<option value="${x[0]}" ${c.state===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select></div></div>
  <label>Address</label><textarea id="c_address">${esc(c.address)}</textarea></details>
  <div class="acts">${id?`<button class="btn danger" data-a="delcust" data-id="${id}" style="margin-right:auto">Delete</button>`:""}<button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="savecust" data-id="${id||""}">Save customer</button></div>`);
}
async function saveCust(id){
  const name=$("#c_name").value.trim();if(!name)return toast("Give the customer a name.");
  const nid=id||uid("c");const gst=$("#c_gstin")?$("#c_gstin").value.trim().toUpperCase():"";
  let state=$("#c_state").value;if(/^[0-9]{2}[A-Z0-9]{13}$/.test(gst)&&stateName(gst.slice(0,2)))state=gst.slice(0,2);
  const c={id:nid,name,phone:$("#c_phone").value.trim(),email:(id&&S.customers[id]?.email)||"",gstin:gst,state,address:$("#c_address").value.trim()};
  if(!id&&findCust(name))return toast("A customer named "+name+" already exists.");
  await put("customers",nid,c);closeModal();
  toast("Customer saved");
}
function payModal(id){const i=S.invoices[id];const bal=r2(i.total-paidOf(i));modal(`<h2>Record payment · ${esc(i.no)}</h2><div class="fr"><div><label>Amount</label><input type="number" min="0" step="0.01" id="py_a" value="${bal}"></div><div><label>Date</label><input type="date" id="py_d" value="${today()}"></div><div><label>Mode</label><select id="py_m">${["Cash","UPI","Card","Bank transfer","Cheque"].map(m=>`<option>${m}</option>`).join("")}</select></div></div><div class="acts"><button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="savepay" data-id="${id}">Record payment</button></div>`)}

/* ============ Output: print, download, CSV ============ */
function standalone(inv){
  const css=[...document.querySelectorAll("style")].map(s=>s.textContent).join("\n");
  return`<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(inv.no)}</title><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet"><style>${css}
body{background:#fff;color:#1A2033;padding:24px}:root{--paper:#fff;--paper-ink:#1A2033}.paper{box-shadow:none;position:static;max-width:820px;margin:auto}#print-area{display:block}</style></head><body onload="setTimeout(function(){try{window.print()}catch(e){}},400)">${invoiceHTML(inv)}</body></html>`;
}
async function sharePdf(id){
  const inv=S.invoices[id];toast("Making PDF…");
  const box=document.createElement("div");box.style.cssText="position:fixed;left:-10000px;top:0;width:794px;background:#fff";
  box.innerHTML=invoiceHTML(inv);const pp=box.firstElementChild;pp.style.position="static";pp.style.boxShadow="none";pp.style.overflow="visible";
  document.body.appendChild(box);
  try{await NATIVE.sharePdf(pp,`${inv.no.replace(/[^\w-]/g,"_")}.pdf`)}catch(e){if(!/cancel/i.test(e.message||""))toast("Couldn't make PDF: "+(e.message||e))}
  box.remove();
}
async function restoreBackup(file){
  let d;try{d=JSON.parse(await file.text())}catch(e){return toast("That file isn't a valid backup.")}
  if(!d||typeof d!=="object"||!d.invoices||!d.settings)return toast("That file isn't a Hisaab backup.");
  if(!await ask(`Replace everything with this backup? (${Object.keys(d.invoices).length} bills, ${Object.keys(d.customers||{}).length} customers)`,"Restore"))return;
  if(DB){for(const c of["invoices","customers"])for(const k in d[c]||{})await put(c,k,d[c][k]);await putSettings({...DEF,...d.settings})}
  else{applyData(d);saveLocal()}
  applyBrand();render();toast("Backup restored");
}
function printInv(id){$("#print-area").innerHTML=invoiceHTML(S.invoices[id]);try{window.print()}catch(e){toast("Printing isn't available here. Use Download and print the file.")}}
async function saveFile(filename,data){
  if(NATIVE){try{await NATIVE.share(filename,data,false)}catch(e){if(!/cancel/i.test(e.message||""))toast("Couldn't share: "+(e.message||e))}return}
  if(DL){try{await DL.save({filename,data});return}catch(e){if(e.code==="declined")return;if(e.code!=="unavailable"&&e.code!=="not_granted"){toast("Couldn't download: "+e.message);return}}}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data]));a.download=filename;document.body.appendChild(a);a.click();a.remove()}catch(e){toast("Downloads aren't available in this view.")}
}
function csv(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["Invoice no","Date","Customer","Customer GSTIN","Place of supply","Taxable","CGST","SGST","IGST","Total","Paid","Balance","Status"]];
  list(S.invoices).filter(i=>i.date>=rep.from&&i.date<=rep.to).sort((a,b)=>a.date.localeCompare(b.date)).forEach(i=>rows.push([i.no,i.date,i.cust?.name||"Walk-in",i.cust?.gstin||"",stateName(i.custState),i.taxable,i.cgst,i.sgst,i.igst,i.total,paidOf(i),r2(i.total-paidOf(i)),status(i)]));
  saveFile(`invoices_${rep.from}_to_${rep.to}.csv`,rows.map(r=>r.map(q).join(",")).join("\n"));
}

/* ============ Sample data ============ */
async function loadSample(){
  if(!await ask("Add a few sample bills and customers? Your existing data stays."))return;
  const P=[["Basmati Rice 5kg","1006",520,5,"bag"],["Sunflower Oil 1L","1512",165,5,"btl"],["Steel Water Bottle","7323",349,18,"pcs"],["LED Bulb 9W","8539",99,18,"pcs"],["Notebook A4","4820",60,18,"pcs"],["Home Delivery","9965",40,18,"trip"]];
  const C=[["Sharma General Stores","98220 11223","27AAKFS1234L1Z5","27","Shop 4, FC Road, Pune"],["Patel Traders","99099 44556","24AAPFP5678M1Z2","24","Ring Road, Surat"],["Anita Kulkarni","98765 43210","","27","Kothrud, Pune"]];
  const mk=async(ci,lines,daysAgo,pay)=>{
    const [name,phone,gstin,state,address]=C[ci];const ex=findCust(name);const cid=ex?ex.id:uid("c");
    if(!ex)await put("customers",cid,{id:cid,name,phone,email:"",gstin,state,address});
    const d=addDays(today(),-daysAgo);const items=lines.map(([k,q])=>{const [n,hsn,price,gst,unit]=P[k];return{pid:"",name:n,hsn,unit,qty:q,price,disc:0,gst}});
    const c=calc({items,custState:state});const id=uid("i");
    await put("invoices",id,{id,no:nextNo(),date:d,due:addDays(d,S.settings.dueDays),customerId:cid,cust:{name,phone,gstin,address,state},custState:state,items,notes:"",total:c.total,taxable:c.taxable,cgst:c.cgst,sgst:c.sgst,igst:c.igst,payments:pay?[{date:d,amount:pay===1?c.total:Math.round(c.total/2),mode:"UPI"}]:[],createdAt:Date.now()-daysAgo*864e5});
  };
  await mk(0,[[0,4],[1,6],[5,1]],3,1);await mk(1,[[2,10],[3,6]],2,2);await mk(2,[[4,12],[2,1]],1,0);
  toast("Sample data added");render();
}

/* ============ Events ============ */
document.addEventListener("click",async e=>{
  const g=e.target.closest("[data-go]");if(g&&!e.target.closest("button")){go(g.dataset.go);return}
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  switch(a){
    case"close":closeModal();break;
    case"filt":invFilter.s=b.dataset.s;render();break;
    case"sample":loadSample();break;
    case"addline":{draft.items.push(blankLine());redrawLines();const n=document.querySelector(`#lines tr[data-k="${draft.items.length-1}"] [data-l="name"]`);n&&n.focus();break}
    case"rmline":draft.items.splice(+b.dataset.k,1);if(!draft.items.length)draft.items.push(blankLine());redrawLines();break;
    case"review":startReview();break;
    case"unreview":draft._review=false;render();break;
    case"saveinv":b.disabled=true;await saveInvoice();b.disabled=false;break;
    case"custbills":invFilter={q:b.dataset.n,s:""};go("invoices");break;
    case"editcust":custModal(id||null,id?null:allCustomers().find(c=>c.name===b.dataset.n));break;
    case"savecust":saveCust(id||null);break;
    case"delcust":if(await ask("Remove this customer's saved details? Their bills are kept.")){await remove("customers",id);closeModal();toast("Customer deleted")}break;
    case"pay":payModal(id);break;
    case"savepay":{const amt=+$("#py_a").value;if(!(amt>0))return toast("Enter an amount above zero.");const i=S.invoices[id];await put("invoices",id,{...i,payments:[...(i.payments||[]),{date:$("#py_d").value||today(),amount:amt,mode:$("#py_m").value}]});closeModal();toast("Payment recorded");break}
    case"delpay":{if(!await ask("Remove this payment?"))return;const i=S.invoices[id];const ps=[...i.payments];ps.splice(+b.dataset.k,1);await put("invoices",id,{...i,payments:ps});render();break}
    case"delinv":{if(!await ask("Delete this bill? This can't be undone."))return;await remove("invoices",id);toast("Bill deleted");go("invoices");break}
    case"print":printInv(id);break;
    case"dl":{const i=S.invoices[id];saveFile(`${i.no.replace(/[^\w-]/g,"_")}.html`,standalone(i));break}
    case"csv":csv();break;
    case"range":{const d=new Date();const y=d.getFullYear(),m=d.getMonth();const f=x=>x.toISOString().slice(0,10);
      if(b.dataset.r==="month")rep={from:today().slice(0,8)+"01",to:today()};
      if(b.dataset.r==="last")rep={from:f(new Date(Date.UTC(y,m-1,1))),to:f(new Date(Date.UTC(y,m,0)))};
      if(b.dataset.r==="fy"){const fy=m>=3?y:y-1;rep={from:`${fy}-04-01`,to:today()}}
      render();break}
    case"savesettings":saveSettings();break;
    case"backup":saveFile(`hisaab-backup-${today()}.json`,dataJSON());break;
    case"restore":$("#restoreFile").click();break;
    case"pdf":sharePdf(id);break;
    case"wipe":{if(!await ask("Erase all bills and customers? This can't be undone."))return;for(const c of["invoices","products","customers"])for(const k of Object.keys(S[c]))await remove(c,k);toast("All data erased");render();break}
  }
});
document.addEventListener("change",e=>{if(e.target.id==="restoreFile"&&e.target.files[0]){restoreBackup(e.target.files[0]);e.target.value=""}});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.f){const k=t.dataset.f;if(k==="cq")cq=t.value;else invFilter[k]=t.value;const pos=t.selectionStart;render();const n=document.querySelector(`[data-f="${k}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}return}
  if(!draft)return;
  if(t.dataset.d){const k=t.dataset.d;draft[k]=t.value;if(k==="payNow"){const pm=$("#paymode");if(pm)pm.hidden=t.value!=="paid";return}refreshPreview();return}
  if(t.dataset.c){const f=t.dataset.c;draft.c[f]=t.value;
    const set=(k,v)=>{draft.c[k]=v;const el=document.querySelector(`[data-c="${k}"]`);if(el)el.value=v};
    if(f==="name"){const ex=findCust(t.value);if(ex&&draft._cm!==ex.id){draft._cm=ex.id;["phone","gstin","address"].forEach(k=>set(k,ex[k]||""));set("state",ex.state||S.settings.state);if(ex.gstin||ex.address||ex.state!==S.settings.state)$("#cmore").open=true}else if(!ex&&draft._cm){draft._cm="";["phone","gstin","address"].forEach(k=>set(k,""));set("state",S.settings.state)}}
    if(f==="gstin"){const g=t.value.trim().toUpperCase();if(/^[0-9]{2}/.test(g)&&stateName(g.slice(0,2)))set("state",g.slice(0,2))}
    refreshPreview();return}
  if(t.dataset.l){const k=+t.closest("tr").dataset.k;const l=draft.items[k];const f=t.dataset.l;
    l[f]=t.value;refreshPreview()}
});

/* ============ Boot ============ */
(async()=>{
  if(NATIVE){const r=await NATIVE.readData().catch(()=>null);if(r){try{applyData(JSON.parse(r))}catch(e){toast("Saved data couldn't be read — restore a backup from Settings.")}}else{loadLocal();if(Object.keys(S.invoices).length)saveLocal()}}
  else loadLocal();
  applyBrand();if(!location.hash)location.hash="invoices";render();if(!NATIVE)connect();
})();
</script>
</body>
</html>
